services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-mirror_image}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Runs once on first DB init (empty volume only).
      - ./Backend/sql:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ${POSTGRES_DB:-mirror_image}"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./Backend
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: ${POSTGRES_USER:-postgres}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      DB_NAME: ${POSTGRES_DB:-mirror_image}
      JWT_SECRET: ${JWT_SECRET:-dev-only-change-me-mirror-image}
      JWT_EXPIRE_HOURS: ${JWT_EXPIRE_HOURS:-168}
    ports:
      - "8000:8000"
    # Persist card/deck art on the host so rebuilds don't wipe thumbnails.
    volumes:
      - ./Backend/app/thumbnails:/app/app/thumbnails
    restart: unless-stopped

  frontend:
    build:
      context: ./Frontend
    depends_on:
      - api
    ports:
      - "3000:80"
    restart: unless-stopped

volumes:
  postgres_data:
