services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-mirror_image}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Runs once on first DB init (empty volume only).
      - ./Backend/sql:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ${POSTGRES_DB:-mirror_image}"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./Backend
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: ${POSTGRES_USER:-postgres}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      DB_NAME: ${POSTGRES_DB:-mirror_image}
      JWT_SECRET: ${JWT_SECRET:-dev-only-change-me-mirror-image}
      JWT_EXPIRE_HOURS: ${JWT_EXPIRE_HOURS:-168}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      STRIPE_PRICE_ID: ${STRIPE_PRICE_ID:-}
      STRIPE_SUBSCRIPTION_TYPE: ${STRIPE_SUBSCRIPTION_TYPE:-standard supporter}
      # Single source for public site URL + CORS/Stripe allowlist (see app/settings.py)
      APP_ENV: ${APP_ENV:-development}
      FRONTEND_URL: ${FRONTEND_URL:-http://127.0.0.1:3000}
      FRONTEND_ORIGINS: ${FRONTEND_ORIGINS:-}
    ports:
      - "8000:8000"
    # Named volume — same idea as production: art lives in the container
    # filesystem, not a host folder (and stays out of git).
    volumes:
      - api_thumbnails:/app/app/thumbnails
    restart: unless-stopped

  frontend:
    build:
      context: ./Frontend
    depends_on:
      - api
    ports:
      - "3000:80"
    restart: unless-stopped

volumes:
  postgres_data:
  api_thumbnails:
