server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  location / {
    try_files $uri $uri/ /index.html;
  }

  # Fingerprinted JS/CSS can be immutable; same-URL images (card_back.png)
  # change in place — do not mark them immutable or browsers keep stale art.
  location ~* \.(?:js|css|woff2?)$ {
    expires 7d;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  location ~* \.(?:png|jpg|jpeg|gif|svg|ico)$ {
    expires 1h;
    add_header Cache-Control "public, must-revalidate";
    try_files $uri =404;
  }
}
