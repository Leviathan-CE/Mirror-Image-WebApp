services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${SQL_PSWRD}
      POSTGRES_DB: ${POSTGRES_DB:-mirror_image}
    # Host port default 5433 avoids clash with a local PostgreSQL on 5432 (common on Windows).
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ${POSTGRES_DB:-mirror_image}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Applies ./sql/*.sql in sorted order after Postgres is ready (safe to re-run if DDL uses IF NOT EXISTS).
  db-migrate:
    image: postgres:16-alpine
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGPASSWORD: ${SQL_PSWRD}
      PGDATABASE: ${POSTGRES_DB:-mirror_image}
      PGUSER: ${POSTGRES_USER:-postgres}
    volumes:
      - ./sql:/sql:ro
    command:
      - sh
      - -c
      - |
        set -e
        for f in $$(ls /sql/*.sql 2>/dev/null | sort); do
          echo "Applying $$f ..."
          psql -h db -U "$$PGUSER" -d "$$PGDATABASE" -v ON_ERROR_STOP=1 -f "$$f"
        done
        echo "Migrations finished."
    restart: "no"

volumes:
  postgres_data:
